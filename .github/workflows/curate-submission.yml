name: Curate ESW submission source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/curate-submission.yml'

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout submission repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout parkingbot main snapshot
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="6327c92e95fb3c960e42b05d44ea27e01d523077"
          git clone --quiet https://github.com/choonpal/parkingbot.git /tmp/parkingbot
          git -C /tmp/parkingbot checkout --quiet "$SOURCE_SHA"
          test "$(git -C /tmp/parkingbot rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Build source-only submission tree
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/parkingbot

          # Remove all previous submission contents, including the temporary
          # parkingbot submodule and setup probes. Keep .git and this workflow
          # until the automated commit has been pushed.
          find . -mindepth 1 -maxdepth 1 \
            ! -name .git ! -name .github -exec rm -rf {} +

          # ROS 2 application source: runtime nodes, web UI, launch files,
          # package metadata and text configuration. Tests, historical docs,
          # trained weights and generated binary calibration outputs are not
          # part of this source-only submission snapshot.
          mkdir -p ros2
          cp -a "$SRC/ros2/cooperative_parking_robot" ros2/
          rm -rf ros2/cooperative_parking_robot/test
          rm -rf ros2/cooperative_parking_robot/docs
          rm -rf ros2/cooperative_parking_robot/models
          rm -f ros2/cooperative_parking_robot/pytest.ini
          rm -f ros2/cooperative_parking_robot/config/*.npz

          # STM32 submission keeps our project/firmware sources and the CubeMX
          # project definition, while excluding ST's redistributable vendor
          # HAL/CMSIS tree. The vendor dependency is documented separately.
          mkdir -p stm32/parking_robot
          cp -a "$SRC/stm32/parking_robot/Core" stm32/parking_robot/
          cp -a "$SRC/stm32/parking_robot/cmake" stm32/parking_robot/
          cp "$SRC/stm32/parking_robot/CMakeLists.txt" stm32/parking_robot/
          cp "$SRC/stm32/parking_robot/CMakePresets.json" stm32/parking_robot/
          cp "$SRC/stm32/parking_robot/parking_robot.ioc" stm32/parking_robot/
          cp "$SRC/stm32/parking_robot/STM32F401RETX_FLASH.ld" stm32/parking_robot/
          cp "$SRC/stm32/parking_robot/STM32F401RETX_RAM.ld" stm32/parking_robot/

          # Calibration and deployment utilities used by the submitted system.
          cp -a "$SRC/dual_tile_homography_tool" ./dual_tile_homography_tool
          rm -f dual_tile_homography_tool/*.npz
          rm -f dual_tile_homography_tool/*.md

          cp -a "$SRC/tools" ./tools
          rm -f tools/test_*.py tools/pytest

          cp "$SRC/LICENSE" ./LICENSE
          cp "$SRC/.gitignore" ./.gitignore

          cat > README.md <<'EOF'
          # Adaptive Valet Bot

          **2026 임베디드 소프트웨어 경진대회 자유공모 부문 · Team MADAS**

          두 대의 주차 로봇이 차량의 전·후방에 접근해 협동 제어하는 ROS 2 기반 지능형 주차 시스템의 제출용 소스코드 저장소입니다. 이 저장소는 개발 저장소 `choonpal/parkingbot`의 `main`을 기준으로, 심사에 필요한 실제 프로그램 소스만 분리한 스냅샷입니다.

          ## Source snapshot

          - Upstream: `choonpal/parkingbot`
          - Branch 기준: `main`
          - Snapshot commit: `6327c92e95fb3c960e42b05d44ea27e01d523077`
          - ROS 2: Humble
          - MCU: STM32F401RE

          ## 핵심 파이프라인

          ```text
          Dual CCTV
              │
              ├─ YOLO11-Seg → 차량 mask 중심 추정
              ├─ Homography → map/global 좌표 변환
              └─ ArUco → Front/Rear 로봇 관측
                         │
                         ▼
                   Fleet Manager
                         │
                    A* / Mission
                         │
              ┌──────────┴──────────┐
              ▼                     ▼
          Front Robot           Rear Robot
              │                     │
              ├──── relative / rigid-body sync ────┤
              │                     │
          Raspberry Pi          Raspberry Pi
              │ UART                │ UART
              ▼                     ▼
            STM32                 STM32
              │                     │
           Drive/Grip            Drive/Grip
          ```

          강체 협동주행 단계에서는 차량에 부착된 마커가 아니라, 천장 카메라의 YOLO11-Seg 차량 검출 결과에서 얻은 차량 중심을 Homography로 `map` 좌표계에 투영해 global 위치 피드백으로 사용합니다. 로봇 간 상대 정렬은 Rear ID0 ArUco 및 로봇 상태 추정을 별도의 상대 제어 정보로 사용하도록 분리되어 있습니다.

          ## 제출 소스 구조

          ```text
          ros2/cooperative_parking_robot/
          ├── cooperative_parking_robot/   # 인지, 위치추정, 계획, 협동제어, UI, 통신
          ├── config/                      # YAML 운용 파라미터
          ├── launch/                      # Jetson / Front / Rear 실행 구성
          ├── resource/
          ├── scripts/                     # 운용·빌드 보조 스크립트
          ├── package.xml
          ├── setup.cfg
          └── setup.py

          stm32/parking_robot/
          ├── Core/                        # 실제 MCU 제어 펌웨어
          ├── cmake/
          ├── parking_robot.ioc
          └── CMakeLists.txt

          dual_tile_homography_tool/       # 듀얼 CCTV Homography 보정 도구
          tools/                           # 배포·preflight·운용 도구
          ```

          ## 주요 구현

          - YOLO11-Seg 기반 차량 인식과 segmentation mask 중심 산출
          - 카메라 보정 및 Homography 기반 CCTV → BEV/map 좌표 변환
          - 듀얼 CCTV 관측 병합과 차량 global pose feedback
          - ArUco 기반 Front/Rear 상대 자세 관측
          - A* 기반 주차/출차 경로 생성 및 Fleet mission 관리
          - Front/Rear 강체 기구학 및 relative synchronization
          - PID/Kalman 기반 상대 오차 보정
          - 차량 global 위치와 로봇 상대 위치를 분리한 협동주행 제어
          - UART 스케줄링, heartbeat 및 STM32 브리지
          - STM32 모터·엔코더·초음파·그리퍼 제어
          - Jetson 기반 operator web UI

          ## 제외한 항목

          이 저장소는 **소스코드 제출본**이므로 다음은 의도적으로 제외했습니다.

          - 자동 회귀/단위 테스트 (`test/`)
          - 개발 과정의 ADR, change log 및 실험 문서
          - 학습된 YOLO weight (`*.pt`)
          - 현장별 생성 calibration 결과 (`*.npz`, Homography `*.npy`)
          - STM32CubeF4의 ST 제공 HAL/CMSIS vendor source
          - 임시 실험 파일, rosbag, 로그, 빌드 산출물

          모델 weight와 현장 calibration 값은 실행 환경에 종속되는 결과물이며, 본 저장소에서는 이를 사용하는 프로그램 소스와 보정 도구를 공개합니다.

          ## Build

          ROS 2 package:

          ```bash
          mkdir -p ~/esw_ws/src
          cp -r ros2/cooperative_parking_robot ~/esw_ws/src/
          cd ~/esw_ws
          colcon build --symlink-install
          source install/setup.bash
          ```

          STM32 firmware는 `stm32/parking_robot/parking_robot.ioc`를 기준으로 STM32CubeMX/CubeIDE에서 STM32CubeF4 HAL/CMSIS를 생성한 뒤 빌드합니다.

          자세한 파일별 제출 범위는 [`SOURCE_MANIFEST.md`](SOURCE_MANIFEST.md), 외부 의존성은 [`THIRD_PARTY.md`](THIRD_PARTY.md)를 참고하십시오.
          EOF

          # Strip heredoc indentation introduced by YAML for readable Markdown.
          sed -i 's/^          //' README.md

          cat > SOURCE_MANIFEST.md <<'EOF'
          # Source Manifest

          본 제출본은 `choonpal/parkingbot` `main`의 commit `6327c92e95fb3c960e42b05d44ea27e01d523077`을 기준으로 생성했습니다.

          ## 포함

          | 경로 | 제출 내용 |
          |---|---|
          | `ros2/cooperative_parking_robot/cooperative_parking_robot/` | ROS 2 런타임 애플리케이션 소스 |
          | `ros2/cooperative_parking_robot/launch/` | 분산 실행 launch |
          | `ros2/cooperative_parking_robot/config/*.yaml` | 제어·사이트 설정 |
          | `ros2/cooperative_parking_robot/web/` | package 내부 operator UI 자산 |
          | `stm32/parking_robot/Core/` | STM32F401RE 애플리케이션 펌웨어 |
          | `stm32/parking_robot/parking_robot.ioc` | MCU peripheral/project configuration |
          | `dual_tile_homography_tool/` | 듀얼 CCTV Homography calibration source |
          | `tools/` | 배포, preflight, 운용 source/scripts |

          ## 제외

          `test/`, 개발 이력 문서, rosbag/log/build 결과, 학습 weight, 현장 calibration binary, ST vendor HAL/CMSIS는 제출 소스 트리에서 제외했습니다.

          본 저장소의 파일은 제출을 위해 새로 재작성한 알고리즘이 아니라 위 upstream snapshot에서 그대로 선별한 코드이며, 루트 README/manifest만 제출 목적에 맞게 새로 작성했습니다.
          EOF
          sed -i 's/^          //' SOURCE_MANIFEST.md

          cat > THIRD_PARTY.md <<'EOF'
          # Third-party dependencies

          이 프로젝트는 ROS 2 Humble 생태계와 OpenCV, Ultralytics YOLO, NumPy 등 외부 라이브러리를 사용합니다. STM32 펌웨어는 STM32CubeF4 HAL/CMSIS에 의존합니다.

          본 source-only 제출 트리에서는 ST 제공 `Drivers/` 사본을 제거하고, `parking_robot.ioc` 및 프로젝트 애플리케이션 소스만 포함했습니다. STM32CubeMX/CubeIDE에서 동일 계열 HAL/CMSIS를 생성하여 사용합니다.

          외부 라이브러리와 모델을 재배포하는 경우 각 프로젝트의 라이선스 조건을 별도로 확인해야 합니다. 원 개발 저장소에 포함된 외부 코드/라이브러리는 해당 라이선스를 따릅니다.
          EOF
          sed -i 's/^          //' THIRD_PARTY.md

          cat > .gitignore <<'EOF'
          build/
          install/
          log/
          __pycache__/
          *.pyc
          *.pyo
          *.bag
          *.db3
          *.mcap
          *.log
          *.npy
          *.npz
          *.pt
          *.engine
          .venv/
          .idea/
          .vscode/
          EOF
          sed -i 's/^          //' .gitignore

          git status --short

      - name: Commit curated submission
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: curate ESW submission source from parkingbot main"
          git push origin HEAD:main
