name: Restore runtime assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-runtime-assets.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout submission repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout parkingbot main snapshot
        run: |
          git clone --depth 1 https://github.com/choonpal/parkingbot.git /tmp/parkingbot
          cd /tmp/parkingbot
          test "$(git rev-parse HEAD)" = "6327c92e95fb3c960e42b05d44ea27e01d523077"

      - name: Copy runtime model and calibration assets
        run: |
          set -euo pipefail
          mkdir -p ros2/cooperative_parking_robot/models
          mkdir -p ros2/cooperative_parking_robot/config
          mkdir -p dual_tile_homography_tool

          cp /tmp/parkingbot/ros2/cooperative_parking_robot/models/parking_vehicle_yolo11n_seg.pt \
             ros2/cooperative_parking_robot/models/

          cp /tmp/parkingbot/ros2/cooperative_parking_robot/config/cctv0_camera_calibration.npz \
             ros2/cooperative_parking_robot/config/
          cp /tmp/parkingbot/ros2/cooperative_parking_robot/config/cctv2_camera_calibration.npz \
             ros2/cooperative_parking_robot/config/
          cp /tmp/parkingbot/ros2/cooperative_parking_robot/config/cctv_camera_calibration.npz \
             ros2/cooperative_parking_robot/config/

          cp /tmp/parkingbot/dual_tile_homography_tool/cctv0_camera_calibration.npz \
             dual_tile_homography_tool/
          cp /tmp/parkingbot/dual_tile_homography_tool/cctv2_camera_calibration.npz \
             dual_tile_homography_tool/

      - name: Commit restored runtime assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f ros2/cooperative_parking_robot/models/parking_vehicle_yolo11n_seg.pt \
                     ros2/cooperative_parking_robot/config/cctv0_camera_calibration.npz \
                     ros2/cooperative_parking_robot/config/cctv2_camera_calibration.npz \
                     ros2/cooperative_parking_robot/config/cctv_camera_calibration.npz \
                     dual_tile_homography_tool/cctv0_camera_calibration.npz \
                     dual_tile_homography_tool/cctv2_camera_calibration.npz
          if git diff --cached --quiet; then
            echo 'No runtime asset changes.'
            exit 0
          fi
          git commit -m 'chore: include runtime model and calibration assets'
          git push
